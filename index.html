<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乖乖記帳 Guaiguai</title>
<style>
  :root { --bg: #FFF9F2; --card: #FFFFFF; --outline: #F1E4D6; --text: #3E3A39; --muted: #6F6663; --accent: #FF8A65; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E1B1A; --card: #2A2523; --outline: #3E3634; --text: #F3EDE6; --muted: #B5ABA4; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.7; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 999px; font-weight: 700; margin-top: 12px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1>乖乖記帳 Guaiguai</h1>
  <p>你的帳本還是你的；想讓另一半看到的那幾筆，點一下就分享。無廣告、一人訂閱兩人用。</p>
  <p class="muted">Your ledger stays yours. Share only the entries you choose. Ad-free, one subscription for two.</p>
  <a class="btn" href="privacy/">隱私政策 · Privacy Policy</a>
  <p class="note">本 App 僅提供記帳與費用分攤計算，不提供付款、轉帳或理財建議。<br>support@kyappstudio.com</p>
</main>
</body>
</html>
